services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aibuddy-backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - BACKEND_PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - STORAGE_MODE=${STORAGE_MODE:-postgres}
      - POSTGRES_DSN=postgres://aibuddy:aibuddy_secret@postgres:5432/aibuddy?sslmode=disable
      - REDIS_ADDR=redis:6379
      - FF_ENABLE_MCP_ACTIONS=${FF_ENABLE_MCP_ACTIONS:-true}
      - FF_ENABLE_RBAC_STRICT=${FF_ENABLE_RBAC_STRICT:-true}
      - FF_ENABLE_CLICKSTREAM_ANALYTICS=${FF_ENABLE_CLICKSTREAM_ANALYTICS:-true}
      - FF_ENABLE_PROACTIVE_CRON_HINTS=${FF_ENABLE_PROACTIVE_CRON_HINTS:-true}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aibuddy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: aibuddy-postgres
    environment:
      - POSTGRES_USER=aibuddy
      - POSTGRES_PASSWORD=aibuddy_secret
      - POSTGRES_DB=aibuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibuddy -d aibuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aibuddy-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
